# Named testing worlds. Data, not code: adding one is an edit here and
# nothing else, which is the point. Apply one with
#
#     tools\flow.ps1 test -Preset stamina
#
# and it sticks to the branch until `land` clears it. Presets combine, and a
# later one wins where they overlap. A one-off override needs no preset at all:
#
#     tools\flow.ps1 test -Set StaminaShareByTier.Gallop=0
#
# A key may name a table member, `Parent.Member`, which is how everything
# per-tier is reached.

# The default, applied when a branch has not chosen a world.
#
# Everything here is switched off because it interrupts the rider mid-test. A
# guard summoned, a dismount, a brawl or a bolting horse each end a run that
# was measuring something else, and the run then has to happen again. Turn one
# back on when it is the thing being tested.
[dev]
CollisionIsCrime = false
ThrowRiderOnStaminaEmpty = false
HorseBoltsWhenSpent = false
Retaliation = false
RetaliationPullsRiderDown = false
RetaliationSurrenderHint = false
WomenRaiseAlarm = false
RearFear = false
RearChargeFear = false

# What an emptied horse does, for testing the stamina figures themselves.
# What a drain costs is only felt when running out does something.
#
# The throw and not the bolt. A horse that bolts on empty ends the run after a
# single impact and walks off with the subject of the test, so the preset that
# exists to count impacts cannot afford it. `HorseBoltsWhenSpent` has its own
# preset below.
[stamina]
ThrowRiderOnStaminaEmpty = true

# What a spent horse does once the rider is off it. Its own preset because it
# ends a run, so it belongs only in a run that is about the bolt itself.
[bolt]
ThrowRiderOnStaminaEmpty = true
HorseBoltsWhenSpent = true

# Ride all day. No impact costs the horse anything, for a test about something
# other than stamina that still needs a lot of impacts.
[freegallop]
StaminaShareByTier.Walk = 0
StaminaShareByTier.Trot = 0
StaminaShareByTier.Gallop = 0
StaminaShareByTier.Rear = 0
StaminaShareByTier.Charge = 0

# The crime system as it ships, for testing what riding somebody down is
# charged as.
[crime]
CollisionIsCrime = true

# Fear as it ships, for testing what a rear and a charge do to the people they
# miss. Off in [dev] for the same reason the brawl is: a crowd that scatters
# takes the subjects of the run with it.
[fear]
RearFear = true
RearChargeFear = true

# Retaliation as it ships, for testing the brawl a shoved man starts.
[retaliation]
Retaliation = true
RetaliationPullsRiderDown = true
RetaliationSurrenderHint = true

# Nobody dies. Impacts still land and still react, but they cost no health, so
# a long run is not also a body count.
[nolethal]
ImpactDamage = false

# Quiet. No spoken lines from anybody, for judging impact sound on its own.
[silent]
Barks = false
RiderVocal = false
